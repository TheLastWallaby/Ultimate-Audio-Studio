[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-audio-studio"
version = "1.2.11"
description = "Senior-friendly, linear-workflow desktop audio workstation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "pygame>=2.6",
    "yt-dlp[default,deno]>=2026.8.19",
    "tinytag>=2.1",
    "certifi",
    "send2trash>=1.8",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
# Code samples in docs (AGENTS.md, .agents skills) are written for readers, not the formatter.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
# Entry-point facade: puts the project root on sys.path before importing the app.
"simple_audio_clipper.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["real_dialogs: show the real modal dialogs instead of auto-cancelling them"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
