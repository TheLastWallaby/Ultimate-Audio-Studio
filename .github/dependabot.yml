# yt-dlp must stay current: YouTube changes regularly break older versions, and the packaged
# .exe freezes whichever yt-dlp was installed at build time. Merging a Dependabot PR that bumps
# yt-dlp triggers .github/workflows/yt-dlp-autorelease.yml, which bumps the app version, tags, and
# publishes a release, so users get the fix via auto-update.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: "increase"
    allow:
      - dependency-name: "yt-dlp"
    labels:
      - "dependencies"
      - "release-needed"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
