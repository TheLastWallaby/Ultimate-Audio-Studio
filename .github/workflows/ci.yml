name: CI Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff mypy bandit pip-audit

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      # The whole package is type-checked strictly (the AGENTS.md gate).
      - name: Mypy (strict)
        run: python -m mypy --strict app/ .github/scripts/bump_version.py

      - name: Bandit
        run: python -m bandit -r app/ -ll -ii -q

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the .exe is built with. Older versions are only held to the static checks
        # (Ruff target py310, mypy python_version 3.10).
        python-version: ['3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build Windows executable
    needs: [quality, test]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          choco install ffmpeg --no-progress
          $realFfmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          $realFfprobe = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffprobe.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          if (-not $realFfmpeg -or -not $realFfprobe) {
            throw "Failed to locate genuine FFmpeg/FFprobe binaries in Chocolatey lib."
          }
          Copy-Item $realFfmpeg .\ffmpeg.exe -Force
          Copy-Item $realFfprobe .\ffprobe.exe -Force

      - name: Build Standalone Executable
        run: .\build_exe.ps1

      - name: Self-test the built executable
        # Runs the frozen .exe with --self-test (bundled FFmpeg/Deno, hidden imports, Tk, audio
        # pipeline) so a broken build is never published to users' auto-updaters.
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $p = Start-Process -FilePath "dist\Ultimate Audio Studio.exe" -ArgumentList "--self-test", "--self-test-report", $report -PassThru
          $null = $p.Handle  # cache the handle so ExitCode is available after the wait
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Self-test did not finish within 5 minutes." }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report was written." }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))." }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: Ultimate-Audio-Studio-exe
          path: dist/Ultimate Audio Studio.exe
          retention-days: 7
