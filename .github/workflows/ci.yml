name: CI Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Modular App Tests
        run: |
          python test_modular_app.py

      - name: Run Updater Tests
        run: |
          python test_updater.py

      - name: Run GUI Smoke Tests
        run: |
          python test_gui_init.py

      - name: Run P0 Regression Tests
        run: |
          python test_p0_fixes.py

      - name: Run Architecture Enhancement Tests
        run: |
          python test_architecture_enhancements.py

      - name: Run Edge Case Regression Tests
        run: |
          python test_edge_cases.py

      - name: Run Settings Tests
        run: |
          python test_settings.py

