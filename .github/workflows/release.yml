name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Called by yt-dlp-autorelease.yml: a tag pushed with GITHUB_TOKEN does not trigger the push event above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.1.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check tag matches app_version
        # The auto-updater compares app_version with the release tag; a mismatch would offer the update forever.
        run: |
          $appVersion = python -c "from app.core.config import get_settings; print(get_settings().app.app_version)"
          if ("v$appVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match app_version $appVersion in app/core/config.py."
          }

      - name: Run tests
        run: python -m pytest -q

      - name: Install FFmpeg
        run: |
          choco install ffmpeg --no-progress
          $realFfmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          $realFfprobe = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffprobe.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          if (-not $realFfmpeg -or -not $realFfprobe) {
            throw "Failed to locate genuine FFmpeg/FFprobe binaries in Chocolatey lib."
          }
          Copy-Item $realFfmpeg .\ffmpeg.exe -Force
          Copy-Item $realFfprobe .\ffprobe.exe -Force
          Write-Host "FFmpeg size: $((Get-Item .\ffmpeg.exe).Length)"
          Write-Host "FFprobe size: $((Get-Item .\ffprobe.exe).Length)"

      - name: Build Standalone Executable
        run: |
          .\build_exe.ps1

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/Ultimate Audio Studio.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
